<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OAWO Mühasibat</title>
<style>
:root{
  --bg:#0f1220; --surface:#171a2b; --surface2:#1e2237; --line:#2a2f4a;
  --text:#e7e9f3; --muted:#9aa0bd; --brand:#5b8cff; --brand2:#7c5cff;
  --green:#2fbf71; --red:#ff5d6c; --amber:#ffb020; --chip:#242a44;
  --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.right{text-align:right}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Login ---------- */
#login{display:flex;align-items:center;justify-content:center;height:100vh;background:
  radial-gradient(1200px 600px at 20% -10%,rgba(91,140,255,.25),transparent),
  radial-gradient(1000px 500px at 100% 0,rgba(124,92,255,.2),transparent),var(--bg)}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:36px;width:380px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-weight:800;color:#fff}
.logo h1{font-size:20px;margin:0}
.login-card p{color:var(--muted);margin:2px 0 22px}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:248px 1fr;height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
aside .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
aside .brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-weight:800;color:#fff}
aside .brand b{font-size:15px}
.nav-group{padding:6px 10px}
.nav-group .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(91,140,255,.18),rgba(124,92,255,.12));color:#fff}
.nav-item .ic{width:18px;text-align:center}
main{overflow-y:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,18,32,.85);backdrop-filter:blur(8px);z-index:5}
.topbar h2{margin:0;font-size:18px}
.content{padding:24px 26px 60px}

/* ---------- Components ---------- */
.btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border:none;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--red);border-color:rgba(255,93,108,.4)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);padding:3px 9px;border-radius:999px;font-size:12px;color:var(--muted)}
.badge{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.badge.draft{background:rgba(255,176,32,.15);color:var(--amber)}
.badge.posted{background:rgba(47,191,113,.15);color:var(--green)}
.badge.void{background:rgba(255,93,108,.15);color:var(--red)}
.badge.paid{background:rgba(91,140,255,.18);color:var(--brand)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.kpi .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .v{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
.kpi .s{font-size:12px;margin-top:4px}
.pos{color:var(--green)} .neg{color:var(--red)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.panel .head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel .head h3{margin:0;font-size:15px}
.panel .body{padding:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:var(--surface2)}
tbody tr:hover{background:var(--surface2)}
tr:last-child td{border-bottom:none}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:10px;font-size:13.5px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,8,18,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);box-shadow:var(--shadow)}
.modal.wide{width:min(960px,100%)}
.modal .mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mhead h3{margin:0}
.modal .mbody{padding:20px;max-height:70vh;overflow-y:auto}
.modal .mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.x{background:transparent;border:none;color:var(--muted);font-size:20px;line-height:1}

/* line editor */
.lines th,.lines td{padding:7px 8px}
.lines input,.lines select{padding:7px 8px}
.totrow{display:flex;justify-content:flex-end;gap:30px;padding:14px 4px 2px}
.totrow .lbl{color:var(--muted)}
.totrow b{font-size:16px}

/* toast */
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:100}
.toast{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--brand);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);min-width:240px}
.toast.err{border-left-color:var(--red)} .toast.ok{border-left-color:var(--green)}
.empty{padding:50px;text-align:center;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{position:fixed;z-index:40;height:100vh;transform:translateX(-100%);transition:.2s}aside.open{transform:none}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <form class="login-card" id="loginForm">
    <div class="logo"><div class="mark">O</div><h1>OAWO Mühasibat</h1></div>
    <p>Peşəkar mühasibatlıq sistemi</p>
    <div class="field"><label class="f">Email</label><input id="li_email" type="email" value="admin@oawo.com" required></div>
    <div class="field"><label class="f">Şifrə</label><input id="li_pass" type="password" value="admin123" required></div>
    <button class="btn primary" style="width:100%;justify-content:center" type="submit">Daxil ol</button>
    <p style="margin-top:16px;font-size:12px" class="muted">Standart giriş: admin@oawo.com / admin123</p>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand"><div class="mark">O</div><b>OAWO Mühasibat</b></div>
    <div class="nav-group" id="nav"></div>
    <div style="margin-top:auto;padding:14px">
      <div class="chip" id="userChip" style="width:100%;justify-content:space-between">
        <span id="userName">—</span>
        <a href="#" id="logout" title="Çıxış">⇥</a>
      </div>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn sm ghost" id="menuBtn" style="display:none">☰</button>
        <h2 id="pageTitle">İdarə paneli</h2>
      </div>
      <div class="tools" id="pageActions"></div>
    </div>
    <div class="content" id="view"><div class="spin"></div></div>
  </main>
</div>

<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
