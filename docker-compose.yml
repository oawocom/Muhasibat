# OAWO Mühasibat — standalone product (ayrıca, mövcud platformadan asılı deyil)
# İşə salmaq:  docker compose up -d --build
# Ünvan:       http://localhost:8090   (admin@oawo.com / admin123)

services:
  db:
    image: postgres:15-alpine
    container_name: oawo_muhasibat_db
    environment:
      POSTGRES_USER: oawo
      POSTGRES_PASSWORD: "${DB_PASSWORD:-oawo}"
      POSTGRES_DB: oawo_muhasibat
    volumes:
      - muhasibat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oawo -d oawo_muhasibat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oawo_muhasibat_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: oawo
      DB_PASSWORD: "${DB_PASSWORD:-oawo}"
      DB_NAME: oawo_muhasibat
      DB_SSLMODE: disable
      PORT: "8080"
      GIN_MODE: release
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@oawo.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      COMPANY_NAME: "${COMPANY_NAME:-OAWO}"
    ports:
      - "8090:8080"
    restart: unless-stopped

  # Reverse proxy + TLS (accounting.oawo.com). Cloudflare "Full (strict)"
  # rejimi ilə işləyir: origin sertifikatını caddy/certs/ qovluğuna qoyun.
  caddy:
    image: caddy:2-alpine
    container_name: oawo_muhasibat_caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  muhasibat_pg:
  caddy_data:
  caddy_config:
